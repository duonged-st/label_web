services:
  mongodb:
    image: mongo:latest 
    ports:
      - "27019:27017"  
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - ./mongo_data:/data/db
  backend:
    build: ./backend
    depends_on:
      - mongodb
      - ai-service
    ports:
      - "5000:5000"   
    env_file:
      - ./backend/.env 
    environment:
      AI_SERVICE_URL: http://ai-service:5001
  frontend:
    build: ./frontend 
    ports:
      - "80:80"          
    depends_on:
      - backend   
  ai-service:
    build: ./ai-service
    ports:
      - "5001:5001"
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: aimodels
  minio:
    image: minio/minio
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"